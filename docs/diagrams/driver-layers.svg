<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">TMC51x0&lt;Comm&gt;, inc/tmc51x0.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#2B3442">SpiCommInterface / UartCommInterface: 40-bit SPI datagrams, daisy-chain padding,</text>
<text x="56" y="531.7" font-size="17" fill="#2B3442">UART frames with CRC8 and node addresses, control pins by name with per-board levels</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">GetMode()  GpioSet()  GpioRead()  DebugLog()  DelayMs()  DelayUs()  SpiTransfer()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#17202C">TMC5160 / TMC5130</text>
<text x="56" y="789" font-size="17" fill="#2B3442">SPI mode 3 up to 4 MHz (internal clock), or single-wire UART  /  DRV_ENN, DIAG0, DIAG1</text>
