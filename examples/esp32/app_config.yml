# ESP32 TMC51x0 Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"
metadata:
  project: "ESP32 TMC51x0 Driver Examples (TMC5130 & TMC5160)"
  default_app: "internal_ramp_comprehensive_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # Internal Ramp Test Suites
  internal_ramp_comprehensive_test:
    description: "Internal-ramp test suite over SPI: core, motor control, ramp control, diagnostics and protection (one motor, encoder and reference switches)"
    source_file: "internal_ramp_test_suites/internal_ramp_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  spi_daisy_chain_comprehensive_test:
    description: "SPI daisy-chain test suite: chain setup, positions and multi-motor moves (set TEST_CHAIN_LENGTH to your hardware)"
    source_file: "internal_ramp_test_suites/spi_daisy_chain_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  uart_multi_node_comprehensive_test:
    description: "UART single-wire test suite: register access, node addressing, send delay and motion (set TEST_NODE_COUNT, default 1)"
    source_file: "internal_ramp_test_suites/uart_multi_node_comprehensive_test.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  internal_ramp_sinusoidal:
    description: "Sinusoidal back-and-forth motion with the internal ramp generator"
    source_file: "internal_ramp_test_suites/internal_ramp_sinusoidal.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  # Fatigue Testing Application (Unified - supports both StallGuard2 and encoder)
  fatigue_test_espnow_unit:
    description: "Fatigue test unit controlled over ESP-NOW or UART, with StallGuard2 or encoder bounds detection"
    source_file: "fatigue_test_espnow/main.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # ESP-NOW Protocol Test Unit (No Motor Control)
  espnow_protocol_test_unit:
    description: "ESP-NOW protocol test unit: answers protocol messages without driving a motor"
    source_file: "fatigue_test_espnow/espnow_protocol_test_unit.cpp"
    category: "testing"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

  # Tuning Tools
  stallguard_tuning:
    description: "Finds the StallGuard2 threshold (SGT) for sensorless homing"
    source_file: "tuning/stallguard_tuning.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  bounds_finding_test:
    description: "Finds the mechanical limits, homes to the centre and reports the travel"
    source_file: "tuning/bounds_finding_test.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # Sensor Examples
  abn_encoder_reader:
    description: "Reads and prints the position of an ABN incremental encoder"
    source_file: "sensors/abn_encoder_reader.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true

  # Diagnostics
  i2c_scan:
    description: "I2C bus scanner for the OLED UI board wiring (SDA = GPIO5, SCL = GPIO23)"
    source_file: "diagnostics/i2c_scan.cpp"
    category: "diagnostics"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: false

build_config:
  build_types:
    Debug:
      description: "Debug symbols, verbose logging, assertions enabled"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build optimized for performance and size"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc51x0_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []
